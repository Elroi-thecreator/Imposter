<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>The Impostor - Party Game</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #ef4444;
      --accent-active: #dc2626;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: #334155;
      --input-bg: #0f172a;
      --success: #38bdf8;
      --chaos: #a855f7;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      margin: 0;
    }

    .app-card {
      background-color: var(--card-bg);
      padding: 1.5rem;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      width: 100%;
      max-width: 420px;
      margin: 16px;
      text-align: center;
    }

    h1 { margin-top: 0; font-size: 1.8rem; color: var(--accent); }
    h2 { font-size: 1.3rem; margin-top: 0; }
    h3 { font-size: 0.95rem; color: var(--subtext); margin-bottom: 8px; }

    .input-group { margin: 12px 0; text-align: left; }
    label {
      display: block;
      margin-bottom: 6px;
      color: var(--subtext);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--input-bg);
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
      touch-action: manipulation;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:active:not(:disabled) { transform: scale(0.98); background-color: var(--accent-active); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .sec-btn { background-color: #334155; }

    .room-code {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 4px;
      color: var(--success);
      background: var(--input-bg);
      padding: 12px;
      border-radius: 12px;
      border: 2px dashed var(--border);
      margin: 12px 0;
    }

    .player-list, .clue-board {
      text-align: left;
      background: var(--input-bg);
      padding: 10px 14px;
      border-radius: 12px;
      margin: 12px 0;
      max-height: 160px;
      overflow-y: auto;
      border: 1px solid var(--border);
    }

    .player-item, .clue-item {
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.95rem;
    }
    .clue-item:last-child { border-bottom: none; }
    .clue-author { color: var(--success); font-weight: bold; }

    .secret-card {
      background: var(--input-bg);
      border: 2px dashed var(--border);
      padding: 20px 15px;
      border-radius: 16px;
      margin: 16px 0;
      font-size: 1.3rem;
      font-weight: 800;
    }

    .vote-btn {
      background-color: #1e293b;
      border: 1.5px solid var(--border);
      text-align: left;
      padding: 12px;
      margin-top: 6px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- HOME SCREEN -->
  <div class="app-card" id="home-screen">
    <h1>🕵️ The Impostor</h1>
    <p id="welcome-subtext" style="color: var(--subtext); font-size: 0.9rem; margin-top: -10px;"></p>

    <div class="input-group">
      <label>Your Nickname</label>
      <input type="text" id="player-name" placeholder="Enter name..." autocomplete="off">
    </div>

    <!-- HOST UI ONLY -->
    <div id="host-start-container">
      <button id="create-btn" onclick="createRoom()">Create Game Room</button>
    </div>

    <!-- PLAYER UI ONLY -->
    <div id="player-join-container" class="hidden">
      <div class="input-group">
        <label>Room Code</label>
        <input type="text" id="join-code" readonly style="text-transform: uppercase; color: var(--subtext);">
      </div>
      <button id="join-btn" onclick="joinRoom()">Join Game</button>
    </div>
  </div>

  <!-- LOBBY SCREEN -->
  <div class="app-card hidden" id="lobby-screen">
    <h2>Room Lobby</h2>
    <div class="room-code" id="display-code">...</div>
    <button class="sec-btn" onclick="copyInviteLink()">📋 Copy Invite Link</button>

    <div style="margin-top: 15px;">
      <h3>Players in Lobby</h3>
      <div class="player-list" id="player-list-display"></div>
    </div>

    <div id="host-controls" class="hidden">
      <div class="input-group">
        <label>Category / Word Source</label>
        <select id="category-select" onchange="toggleCustomWordInput()">
          <option value="RANDOM">🎲 Random Category</option>
          <option value="Places & Landmarks">📍 Places & Landmarks</option>
          <option value="Food & Drink">🍔 Food & Drink</option>
          <option value="Pop Culture & Fantasy">🪄 Pop Culture & Fantasy</option>
          <option value="Animals & Nature">🦁 Animals & Nature</option>
          <option value="CUSTOM">✏️ Custom Word</option>
        </select>
      </div>

      <div class="input-group hidden" id="custom-word-group">
        <label>Custom Word</label>
        <input type="text" id="custom-word-input" placeholder="Type secret word...">
      </div>

      <div class="input-group">
        <label>Chaos Round Mode</label>
        <select id="chaos-mode-select">
          <option value="SURPRISE">🎲 Surprise (~15% Chance Everyone is Impostor)</option>
          <option value="ALWAYS">🌀 Forced Chaos (100% Everyone is Impostor)</option>
          <option value="OFF">🚫 Disabled (Normal Games Only)</option>
        </select>
      </div>

      <button onclick="hostStartGame()">Start Game</button>
    </div>
    <p id="waiting-msg" style="color: var(--subtext); font-size: 0.9rem;">Waiting for host to start...</p>
  </div>

  <!-- GAME SCREEN -->
  <div class="app-card hidden" id="game-screen">
    <h2>Your Secret Role</h2>
    <div class="secret-card" id="role-display">Loading...</div>
    <p id="category-hint" style="color: var(--subtext); font-size: 0.85rem; margin-top: -10px;"></p>

    <!-- IN-GAME CLUE SUBMISSION -->
    <div class="input-group" id="clue-input-box" style="margin-top: 20px;">
      <label>Submit Your One-Word Clue</label>
      <input type="text" id="clue-text-input" placeholder="Type your clue..." autocomplete="off">
      <button id="submit-clue-btn" onclick="submitClue()">Send Clue</button>
    </div>

    <div style="margin-top: 15px;">
      <h3>Shared Clues Board</h3>
      <div class="clue-board" id="clue-board-display">
        <p style="color:var(--subtext); font-size:0.85rem; text-align:center; margin:10px 0;">Waiting for clues...</p>
      </div>
    </div>

    <div id="host-discussion-controls" class="hidden" style="margin-top: 15px;">
      <button onclick="hostStartVoting()">Go To Voting Phase</button>
    </div>
  </div>

  <!-- VOTING SCREEN -->
  <div class="app-card hidden" id="voting-screen">
    <h2>Who is the Impostor?</h2>
    <p style="color: var(--subtext); font-size: 0.85rem;">Review the clues board and cast your vote!</p>
    
    <div class="clue-board" id="voting-clues-summary" style="max-height: 110px;"></div>

    <div id="vote-options-list"></div>
  </div>

  <!-- RESULT SCREEN -->
  <div class="app-card hidden" id="result-screen">
    <h2 id="result-title">Game Over</h2>
    <div class="secret-card" id="result-details"></div>
    <button id="next-round-btn" class="hidden" onclick="hostReturnToLobby()">Return to Lobby</button>
    <p id="client-wait-lobby" style="color: var(--subtext); font-size: 0.9rem;">Waiting for host...</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
