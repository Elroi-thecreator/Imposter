<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>The Impostor - Party Game</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #ef4444;
      --accent-active: #dc2626;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: #334155;
      --input-bg: #0f172a;
      --success: #38bdf8;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      margin: 0;
    }

    .app-card {
      background-color: var(--card-bg);
      padding: 1.5rem;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      width: 100%;
      max-width: 420px;
      margin: 16px;
      text-align: center;
    }

    h1 { margin-top: 0; font-size: 1.8rem; color: var(--accent); }
    h2 { font-size: 1.3rem; margin-top: 0; }
    h3 { font-size: 0.95rem; color: var(--subtext); margin-bottom: 8px; }

    .input-group { margin: 12px 0; text-align: left; }
    label {
      display: block;
      margin-bottom: 6px;
      color: var(--subtext);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--input-bg);
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
      touch-action: manipulation;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:active:not(:disabled) { transform: scale(0.98); background-color: var(--accent-active); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .sec-btn { background-color: #334155; }

    .room-code {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 4px;
      color: var(--success);
      background: var(--input-bg);
      padding: 12px;
      border-radius: 12px;
      border: 2px dashed var(--border);
      margin: 12px 0;
    }

    .player-list {
      text-align: left;
      background: var(--input-bg);
      padding: 10px 14px;
      border-radius: 12px;
      margin: 12px 0;
      max-height: 140px;
      overflow-y: auto;
      border: 1px solid var(--border);
    }

    .player-item {
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .secret-card {
      background: var(--input-bg);
      border: 2px dashed var(--border);
      padding: 24px 15px;
      border-radius: 16px;
      margin: 16px 0;
      font-size: 1.4rem;
      font-weight: 800;
    }

    .vote-btn {
      background-color: #1e293b;
      border: 1.5px solid var(--border);
      text-align: left;
      padding: 12px;
      margin-top: 6px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- HOME SCREEN -->
  <div class="app-card" id="home-screen">
    <h1>🕵️ The Impostor</h1>
    <p id="welcome-subtext" style="color: var(--subtext); font-size: 0.9rem; margin-top: -10px;"></p>

    <div class="input-group">
      <label>Your Nickname</label>
      <input type="text" id="player-name" placeholder="Enter name..." autocomplete="off">
    </div>

    <!-- HOST UI ONLY -->
    <div id="host-start-container">
      <button id="create-btn" onclick="createRoom()">Create Game Room</button>
    </div>

    <!-- PLAYER UI ONLY -->
    <div id="player-join-container" class="hidden">
      <div class="input-group">
        <label>Room Code</label>
        <input type="text" id="join-code" readonly style="text-transform: uppercase; color: var(--subtext);">
      </div>
      <button id="join-btn" onclick="joinRoom()">Join Game</button>
    </div>
  </div>

  <!-- LOBBY SCREEN -->
  <div class="app-card hidden" id="lobby-screen">
    <h2>Room Lobby</h2>
    <div class="room-code" id="display-code">...</div>
    <button class="sec-btn" onclick="copyInviteLink()">📋 Copy Invite Link</button>

    <div style="margin-top: 15px;">
      <h3>Players in Lobby</h3>
      <div class="player-list" id="player-list-display"></div>
    </div>

    <div id="host-controls" class="hidden">
      <div class="input-group">
        <label>Category / Word Source</label>
        <select id="category-select" onchange="toggleCustomWordInput()">
          <option value="RANDOM">🎲 Random Category</option>
          <option value="Places & Landmarks">📍 Places & Landmarks</option>
          <option value="Food & Drink">🍔 Food & Drink</option>
          <option value="Pop Culture & Fantasy">🪄 Pop Culture & Fantasy</option>
          <option value="Animals & Nature">🦁 Animals & Nature</option>
          <option value="CUSTOM">✏️ Custom Word</option>
        </select>
      </div>

      <div class="input-group hidden" id="custom-word-group">
        <label>Custom Word</label>
        <input type="text" id="custom-word-input" placeholder="Type secret word...">
      </div>

      <button onclick="hostStartGame()">Start Game</button>
    </div>
    <p id="waiting-msg" style="color: var(--subtext); font-size: 0.9rem;">Waiting for host to start...</p>
  </div>

  <!-- GAME SCREEN -->
  <div class="app-card hidden" id="game-screen">
    <h2>Your Secret Role</h2>
    <div class="secret-card" id="role-display">Loading...</div>
    <p id="category-hint" style="color: var(--subtext); font-size: 0.9rem;"></p>

    <div id="host-discussion-controls" class="hidden" style="margin-top: 15px;">
      <button onclick="hostStartVoting()">Start Voting Phase</button>
    </div>
  </div>

  <!-- VOTING SCREEN -->
  <div class="app-card hidden" id="voting-screen">
    <h2>Who is the Impostor?</h2>
    <p style="color: var(--subtext); font-size: 0.85rem;">Cast your vote based on clues!</p>
    <div id="vote-options-list"></div>
  </div>

  <!-- RESULT SCREEN -->
  <div class="app-card hidden" id="result-screen">
    <h2 id="result-title">Game Over</h2>
    <div class="secret-card" id="result-details"></div>
    <button id="next-round-btn" class="hidden" onclick="hostReturnToLobby()">Return to Lobby</button>
    <p id="client-wait-lobby" style="color: var(--subtext); font-size: 0.9rem;">Waiting for host...</p>
  </div>

  <script>
    const WORD_CATEGORIES = {
      "Places & Landmarks": ["Eiffel Tower", "Pyramid", "Hollywood", "Volcano", "Hogwarts", "Airport", "Casino", "Aquarium", "Hospital"],
      "Food & Drink": ["Pizza", "Sushi", "Chocolate", "Tacos", "Burger", "Pancakes", "Bubble Tea", "Spaghetti", "Donut"],
      "Pop Culture & Fantasy": ["Superhero", "Dragon", "Wizard", "Unicorn", "Pirate", "Ninja", "Astronaut", "Alien", "Zombie"],
      "Animals & Nature": ["Penguin", "Dinosaur", "Waterfall", "Tornado", "Octopus", "Kangaroo", "Flamingo", "Sloth", "Panda"]
    };

    let peer = null, isHost = false, roomCode = "", myName = "", myPeerId = "";
    let players = [];
    let hostConn = null, secretWord = "", currentCategory = "", impostorId = "";
    let votes = {};

    window.onload = () => {
      const codeFromUrl = new URLSearchParams(window.location.search).get('room');
      
      if (codeFromUrl) {
        isHost = false;
        roomCode = codeFromUrl.toUpperCase();
        document.getElementById('join-code').value = roomCode;
        document.getElementById('host-start-container').classList.add('hidden');
        document.getElementById('player-join-container').classList.remove('hidden');
        document.getElementById('welcome-subtext').innerText = "Joining existing game room";
      } else {
        isHost = true;
        document.getElementById('host-start-container').classList.remove('hidden');
        document.getElementById('player-join-container').classList.add('hidden');
        document.getElementById('welcome-subtext').innerText = "Host a new party game";
      }
    };

    function getName() {
      const name = document.getElementById('player-name').value.trim();
      if (!name) { alert("Please enter your nickname!"); return null; }
      return name;
    }

    function resetJoinBtn() {
      const btn = document.getElementById('join-btn');
      btn.disabled = false;
      btn.innerText = "Join Game";
    }

    function createRoom() {
      myName = getName(); if (!myName) return;
      const createBtn = document.getElementById('create-btn');
      createBtn.disabled = true;
      createBtn.innerText = "Creating Room...";

      isHost = true;
      roomCode = Math.random().toString(36).substring(2, 7).toUpperCase();
      peer = new Peer(`impostor-room-${roomCode}`);

      peer.on('open', (id) => {
        myPeerId = id;
        players = [{ id: id, name: myName, conn: null }];
        showScreen('lobby-screen');
        updatePlayerList();
      });

      peer.on('connection', (conn) => {
        conn.on('data', (data) => handleHostData(conn, data));
      });

      peer.on('error', () => {
        alert("Error creating room. Try refreshing!");
        createBtn.disabled = false;
        createBtn.innerText = "Create Game Room";
      });
    }

    function joinRoom() {
      myName = getName(); if (!myName) return;

      const joinBtn = document.getElementById('join-btn');
      joinBtn.disabled = true;
      joinBtn.innerText = "Connecting...";

      if (peer) peer.destroy(); // Clean up existing connection if any
      peer = new Peer();

      peer.on('open', (id) => {
        myPeerId = id;
        hostConn = peer.connect(`impostor-room-${roomCode}`);
        
        hostConn.on('open', () => hostConn.send({ type: 'JOIN', name: myName }));
        hostConn.on('data', (data) => handleClientData(data));
        
        hostConn.on('error', () => {
          alert("Could not connect to host.");
          resetJoinBtn();
        });
      });

      peer.on('error', () => {
        alert("Network error. Could not reach server.");
        resetJoinBtn();
      });
    }

    function handleHostData(conn, data) {
      if (data.type === 'JOIN') {
        const isDuplicate = players.some(
          p => p.name.trim().toLowerCase() === data.name.trim().toLowerCase()
        );

        if (isDuplicate) {
          conn.send({ 
            type: 'JOIN_REJECTED', 
            reason: `The name "${data.name}" is already taken. Please pick another nickname.` 
          });
          return;
        }

        players.push({ id: conn.peer, name: data.name, conn: conn });
        updatePlayerList();
        broadcastLobbyState();
      } else if (data.type === 'CAST_VOTE') {
        votes[data.targetId] = (votes[data.targetId] || 0) + 1;
        if (Object.values(votes).reduce((a,b)=>a+b, 0) >= players.length) {
          tallyVotes();
        }
      }
    }

    function handleClientData(data) {
      if (data.type === 'JOIN_REJECTED') {
        alert(data.reason);
        resetJoinBtn();
        if (peer) peer.destroy();
        showScreen('home-screen');
      } else if (data.type === 'LOBBY_STATE') {
        updatePlayerListFromNames(data.playerNames);
        showScreen('lobby-screen');
      } else if (data.type === 'GAME_START') {
        showGameScreen(data.role, data.word, data.category);
      } else if (data.type === 'START_VOTING') {
        showVotingScreen(data.playerList);
      } else if (data.type === 'GAME_OVER') {
        showResultScreen(data.ejectedName, data.isImpostor, data.secretWord, data.impostorName);
      }
    }

    function toggleCustomWordInput() {
      const val = document.getElementById('category-select').value;
      document.getElementById('custom-word-group').classList.toggle('hidden', val !== 'CUSTOM');
    }

    function hostStartGame() {
      if (players.length < 3) return alert("You need at least 3 players to start!");

      const catVal = document.getElementById('category-select').value;
      if (catVal === 'CUSTOM') {
        secretWord = document.getElementById('custom-word-input').value.trim();
        currentCategory = "Custom Choice";
        if (!secretWord) return alert("Please enter a custom word!");
      } else if (catVal === 'RANDOM') {
        const keys = Object.keys(WORD_CATEGORIES);
        currentCategory = keys[Math.floor(Math.random() * keys.length)];
        const list = WORD_CATEGORIES[currentCategory];
        secretWord = list[Math.floor(Math.random() * list.length)];
      } else {
        currentCategory = catVal;
        const list = WORD_CATEGORIES[currentCategory];
        secretWord = list[Math.floor(Math.random() * list.length)];
      }

      const impostorIdx = Math.floor(Math.random() * players.length);
      impostorId = players[impostorIdx].id;
      votes = {};

      players.forEach((p) => {
        const isImp = (p.id === impostorId);
        const payload = {
          type: 'GAME_START',
          role: isImp ? 'IMPOSTOR' : 'CREWMATE',
          word: isImp ? null : secretWord,
          category: currentCategory
        };

        if (p.conn) p.conn.send(payload);
        else showGameScreen(payload.role, payload.word, payload.category);
      });
    }

    function showGameScreen(role, word, category) {
      showScreen('game-screen');
      const display = document.getElementById('role-display');
      const hint = document.getElementById('category-hint');

      if (role === 'IMPOSTOR') {
        display.innerText = "🚨 YOU ARE THE IMPOSTOR!";
        display.style.color = "var(--accent)";
        hint.innerText = `Category Hint: ${category}`;
      } else {
        display.innerText = `Word: ${word}`;
        display.style.color = "var(--success)";
        hint.innerText = `Category: ${category}`;
      }

      if (isHost) document.getElementById('host-discussion-controls').classList.remove('hidden');
    }

    function hostStartVoting() {
      const playerListPayload = players.map(p => ({ id: p.id, name: p.name }));
      players.forEach(p => {
        if (p.conn) p.conn.send({ type: 'START_VOTING', playerList: playerListPayload });
        else showVotingScreen(playerListPayload);
      });
    }

    function showVotingScreen(playerListPayload) {
      showScreen('voting-screen');
      const listEl = document.getElementById('vote-options-list');
      listEl.innerHTML = playerListPayload.map(p => `
        <button class="vote-btn" onclick="submitVote('${p.id}')">Vote for ${p.name}</button>
      `).join('');
    }

    function submitVote(targetId) {
      document.getElementById('vote-options-list').innerHTML = "<p style='color:var(--subtext)'>Vote submitted! Waiting for others...</p>";
      if (isHost) {
        votes[targetId] = (votes[targetId] || 0) + 1;
        if (Object.values(votes).reduce((a,b)=>a+b, 0) >= players.length) tallyVotes();
      } else {
        hostConn.send({ type: 'CAST_VOTE', targetId: targetId });
      }
    }

    function tallyVotes() {
      let maxVotes = 0, ejectedId = null;
      for (let id in votes) {
        if (votes[id] > maxVotes) { maxVotes = votes[id]; ejectedId = id; }
      }

      const ejectedPlayer = players.find(p => p.id === ejectedId);
      const impostorPlayer = players.find(p => p.id === impostorId);
      const isImp = (ejectedId === impostorId);

      players.forEach(p => {
        const payload = {
          type: 'GAME_OVER',
          ejectedName: ejectedPlayer ? ejectedPlayer.name : "Nobody",
          isImpostor: isImp,
          secretWord: secretWord,
          impostorName: impostorPlayer ? impostorPlayer.name : "Unknown"
        };
        if (p.conn) p.conn.send(payload);
        else showResultScreen(payload.ejectedName, payload.isImpostor, payload.secretWord, payload.impostorName);
      });
    }

    function showResultScreen(ejectedName, isImpostor, secretWord, impostorName) {
      showScreen('result-screen');
      const title = document.getElementById('result-title');
      const details = document.getElementById('result-details');

      if (isImpostor) {
        title.innerText = "🎉 Crewmates Win!";
        title.style.color = "var(--success)";
      } else {
        title.innerText = "🚨 Impostor Wins!";
        title.style.color = "var(--accent)";
      }

      details.innerHTML = `
        <p style="font-size:1.1rem; margin-top:0;"><strong>${ejectedName}</strong> was voted out.</p>
        <hr style="border:0; border-top:1px solid var(--border); margin:10px 0;">
        <p style="font-size:0.95rem; color:var(--subtext); margin:5px 0;">The Impostor was: <strong>${impostorName}</strong></p>
        <p style="font-size:0.95rem; color:var(--subtext); margin:5px 0;">Secret Word: <strong>${secretWord}</strong></p>
      `;

      if (isHost) {
        document.getElementById('next-round-btn').classList.remove('hidden');
        document.getElementById('client-wait-lobby').classList.add('hidden');
      } else {
        document.getElementById('next-round-btn').classList.add('hidden');
        document.getElementById('client-wait-lobby').classList.remove('hidden');
      }
    }

    function hostReturnToLobby() {
      broadcastLobbyState();
      showScreen('lobby-screen');
    }

    function showScreen(id) {
      ['home-screen', 'lobby-screen', 'game-screen', 'voting-screen', 'result-screen'].forEach(s => {
        document.getElementById(s).classList.add('hidden');
      });
      document.getElementById(id).classList.remove('hidden');
      if (id === 'lobby-screen' && isHost) {
        document.getElementById('host-controls').classList.remove('hidden');
        document.getElementById('waiting-msg').classList.add('hidden');
      }
    }

    function updatePlayerList() { updatePlayerListFromNames(players.map(p => p.name)); }
    function updatePlayerListFromNames(names) {
      document.getElementById('player-list-display').innerHTML = names.map(n => `<div class="player-item"><span>• ${n}</span></div>`).join('');
    }
    function broadcastLobbyState() {
      const names = players.map(p => p.name);
      players.forEach(p => { if (p.conn) p.conn.send({ type: 'LOBBY_STATE', playerNames: names }); });
    }
    function copyInviteLink() {
      const link = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
      navigator.clipboard.writeText(link).then(() => alert("Link copied to clipboard!"));
    }
  </script>
</body>
</html>
